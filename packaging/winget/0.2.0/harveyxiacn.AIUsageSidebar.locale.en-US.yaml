ShortDescription: Edge sidebar showing Claude Code and Codex rate-limit quotas
Description: |-
  An always-on-top edge sidebar that shows one progress ring per AI coding
  agent (Claude Code, OpenAI Codex) with the current rate-limit windows and
  when they reset. Hovering a ring opens a detail popover; a dashboard window
  holds settings and the token usage history parsed from the providers' local
  session logs.

  The app reads the credentials the official CLIs already store on the machine
  and has no login of its own. Builds are not code-signed, so Windows
  SmartScreen warns the first time the installer runs.
