name: CI

# A typo in the README must not spend 45 minutes on three runners, so
# documentation-only changes skip the build. The two lists below must stay
# identical; GitHub Actions does not support YAML anchors, so they are spelled
# out twice on purpose.
#
# NOTE: `paths-ignore` makes the whole workflow *not run*, which means its
# checks never report at all. Do not mark them "required" in branch protection
# without a companion always-runs job — see docs/RELEASING.md ("Docs-only
# changes") for why and what to do instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'packaging/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'packaging/**'
  workflow_dispatch:
    inputs:
      interactive_browser_tests:
        description: 'Also run browser scenarios that simulate mouse and keyboard input'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # reqwest pulls rustls -> aws-lc-sys, whose x86_64 Windows build assembles
  # its .asm files with NASM and panics ("NASM command not found! Build cannot
  # continue.") when it is missing. Allow the objects the crate vendors for
  # exactly this case. Consulted only on windows-x86_64 and only when NASM is
  # absent, so it is a no-op on Linux/macOS and on runners that do ship NASM.
  AWS_LC_SYS_PREBUILT_NASM: 1
  # CI has no updater signing key (and forks never will), so the bundler must
  # not try to sign updater artifacts. Releases decide this per run; see
  # .github/workflows/release.yml and docs/RELEASING.md.
  NO_UPDATER_CONFIG: --config src-tauri/updater-disabled.conf.json

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-layer-shell0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the frontend
        run: pnpm check

      - name: Check the translations
        run: pnpm check:i18n

      - name: Check the AGENTS.md settings table
        run: pnpm check:agents

      - name: Test frontend logic
        run: pnpm test

      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      # AGENTS.md disallows simulated input during agent validation. Keep these
      # scenarios available for an explicitly opted-in manual workflow run.
      - name: Test interactive browser workflows (manual opt-in)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.interactive_browser_tests
        run: pnpm test:e2e

      - name: Test session rendering and chart reuse
        if: runner.os == 'Linux'
        run: pnpm exec playwright test --config=tests/render.config.ts

      - name: Upload browser failure diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # `native-smoke` dlopens libgtk-layer-shell.so.0 and resolves every
      # symbol the Wayland docking path calls. It can only run where the
      # library exists, which is why it is off by default.
      - name: cargo test (gtk-layer-shell symbols)
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src-tauri
        run: 'cargo test --locked --features native-smoke smoke::'

      - name: Build the app bundles
        run: pnpm tauri build --ci ${{ env.NO_UPDATER_CONFIG }} -- --locked

      - name: Upload the Linux binary for the smoke test
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          if-no-files-found: error
          retention-days: 1
          path: src-tauri/target/release/ai-usage-sidebar

      - name: Upload the Windows exe for the smoke tests
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          if-no-files-found: error
          retention-days: 1
          path: src-tauri/target/release/ai-usage-sidebar.exe

      # upload-artifact drops the executable bit, so ship the bundle as a tar.
      - name: Pack the macOS app for the smoke tests
        if: matrix.platform == 'macos-latest'
        run: tar -C src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/macos-app.tar" "AI Usage Sidebar.app"

      - name: Upload the macOS app for the smoke tests
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/macos-app.tar

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Actually starts the binary. Unit and browser tests cannot see a start-up
  # panic, a missing runtime library or a sidebar that never gets revealed.
  smoke:
    name: Linux start-up smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the runtime libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            xvfb \
            dbus-x11

      - name: Download the binary built above
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin

      - name: Launch it and wait for `sidebar revealed`
        run: |
          chmod +x bin/ai-usage-sidebar
          scripts/smoke-linux.sh "$PWD/bin/ai-usage-sidebar"
        env:
          SMOKE_LOG_COPY: ${{ runner.temp }}/smoke-logs

      - name: Upload the logs of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-linux
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  smoke-windows:
    name: Windows start-up smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the exe built above
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: bin

      - name: Launch it and wait for `sidebar revealed`
        shell: pwsh
        run: scripts/smoke-windows.ps1 -Exe bin/ai-usage-sidebar.exe -LogCopy "$env:RUNNER_TEMP/smoke-logs"

      - name: Upload the logs of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  smoke-macos:
    name: macOS start-up smoke test
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the app built above
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: bin

      - name: Unpack it, launch it and wait for `sidebar revealed`
        run: |
          tar -C bin -xf bin/macos-app.tar
          scripts/smoke-macos.sh "$PWD/bin/AI Usage Sidebar.app"
        env:
          SMOKE_LOG_COPY: ${{ runner.temp }}/smoke-logs

      - name: Upload the logs of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  # Installs a PREVIOUS published release, runs it, then starts this build on
  # the same profile with a hand-written BOM settings.json. Catches what a
  # fresh-profile smoke test cannot: database migrations and settings files
  # written by older versions. Slower and downloads from GitHub, so it runs on
  # pull requests and manual runs only, not on every push to main.
  upgrade:
    name: Upgrade from ${{ matrix.from }} (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # v0.5.0 holds usage.db schema 2, so the 2 -> 3 migration must run.
        # `latest` is whatever is published newest (no migration required).
        from: [v0.5.0, latest]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release to upgrade from
        shell: bash
        run: |
          tag="${{ matrix.from }}"
          if [[ "$tag" == latest ]]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SMOKE_LOG_COPY=$RUNNER_TEMP/smoke-logs" >> "$GITHUB_ENV"
          if [[ "${{ matrix.from }}" == v0.5.0 ]]; then echo "SMOKE_EXPECT_MIGRATION=2" >> "$GITHUB_ENV"; fi
          echo "Upgrading from $tag"

      # ---- Linux
      - name: Install the runtime libraries and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb dbus-x11

      - name: Download the new build (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin

      - name: Upgrade smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.AppImage' --dir old
          chmod +x bin/ai-usage-sidebar old/*.AppImage
          SMOKE_UPGRADE_FROM="$(ls "$PWD"/old/*.AppImage)" scripts/smoke-linux.sh "$PWD/bin/ai-usage-sidebar"

      # ---- macOS
      - name: Download the new build (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: bin

      - name: Upgrade smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -C bin -xf bin/macos-app.tar
          # macos-latest is Apple Silicon; fall back to the Intel dmg otherwise.
          if [[ "$(uname -m)" == arm64 ]]; then pat='*_aarch64.dmg'; else pat='*_x64.dmg'; fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pat" --dir old
          SMOKE_UPGRADE_FROM="$(ls "$PWD"/old/*.dmg)" scripts/smoke-macos.sh "$PWD/bin/AI Usage Sidebar.app"

      # ---- Windows
      - name: Download the new build (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: bin

      - name: Upgrade smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*_x64-setup.exe' --dir old
          $installer = (Get-ChildItem old -Filter *.exe | Select-Object -First 1).FullName
          scripts/smoke-windows.ps1 -Exe bin/ai-usage-sidebar.exe -UpgradeFrom $installer -ExpectMigration $env:SMOKE_EXPECT_MIGRATION -LogCopy $env:SMOKE_LOG_COPY

      - name: Upload the logs of a failed upgrade test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs-${{ matrix.os }}-${{ matrix.from }}
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
          retention-days: 7
