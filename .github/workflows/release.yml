name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # See the note in ci.yml: aws-lc-sys (rustls, via reqwest) needs NASM to
  # build for x86_64 Windows and panics without it. Consulted only there and
  # only when NASM is missing.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  release:
    name: ${{ matrix.platform }} ${{ matrix.args }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel macOS are built separately so each DMG is
          # a native binary.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Expected a version tag such as v0.1.0"; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "Release must refer to an existing tag"; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm check && pnpm test

      # `bundle.createUpdaterArtifacts` is on in tauri.conf.json, and the CLI
      # refuses to build ("A public key has been found, but no private key")
      # unless TAURI_SIGNING_PRIVATE_KEY is set. The maintainer may not have
      # created that key yet, so a missing secret must degrade to a perfectly
      # normal release instead of a red run: we then merge a config override
      # that turns updater artifacts off and skip latest.json.
      - name: Decide whether this release carries updater artifacts
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'config=' >> "$GITHUB_OUTPUT"
            echo "Updater artifacts will be signed and latest.json uploaded."
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'config=--config src-tauri/updater-disabled.conf.json' >> "$GITHUB_OUTPUT"
            echo "::warning title=Updater artifacts disabled::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no latest.json and installed copies will not be offered an in-app update. See docs/RELEASING.md."
          fi

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the secret does not exist; the step above then disabled
          # updater artifacts, so the bundler never looks at them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'AI Usage Sidebar ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          # Each matrix job merges its platforms into the latest.json already
          # attached to the release, so all four builds end up in one file.
          uploadUpdaterJson: ${{ steps.updater.outputs.enabled }}
          args: ${{ steps.updater.outputs.config }} ${{ matrix.args }} -- --locked
