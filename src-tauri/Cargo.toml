[package]
name = "ai-usage-sidebar"
version = "0.2.2"
description = "Edge sidebar widget showing Claude Code / Codex rate-limit quotas and token usage history"
authors = ["Harvey Xia"]
license = "MIT"
repository = "https://github.com/harveyxiacn/AI-usage-monitor-sidebar"
edition = "2021"

[features]
native-smoke = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_usage_sidebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
thiserror = "2.0.20"
anyhow = "1.0.104"
log = "0.4.34"
base64 = "0.23.1"
walkdir = "2.5.0"
async-trait = "0.1.92"
parking_lot = "0.12.5"
once_cell = "1.21.4"
notify = "8.2.0"
reqwest = { version = "0.13", features = ["json", "gzip"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-global-shortcut = "2.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }
